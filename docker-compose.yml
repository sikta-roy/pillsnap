# Full local stack: PostgreSQL + FastAPI (ML models) + Next.js
#   docker compose up --build
# then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pillsnap
      POSTGRES_PASSWORD: pillsnap
      POSTGRES_DB: pillsnap
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillsnap"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pillsnap:pillsnap@db:5432/pillsnap
      PORT: "8000"
      PILLSNAP_CORS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
