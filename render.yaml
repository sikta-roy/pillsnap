# Render blueprint for the backend + managed PostgreSQL.
# The frontend deploys to Vercel (root directory: frontend, env NEXT_PUBLIC_API_URL=<this service URL>).
databases:
  - name: pillsnap-db
    plan: free
    databaseName: pillsnap
    user: pillsnap

services:
  - type: web
    name: pillsnap-api
    runtime: docker
    rootDir: backend
    plan: starter   # the models need ~1.5 GB RAM; the free plan (512 MB) is too small
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: pillsnap-db, property: connectionString }
      - key: PILLSNAP_CORS
        value: https://your-app.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
